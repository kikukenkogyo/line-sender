<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06c755">
<title>LINE送信管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    overscroll-behavior-y: contain;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #f0f2f5;
    color: #111;
    min-height: 100vh;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  /* プルダウン更新インジケーター */
  .pull-indicator {
    text-align: center;
    height: 0;
    overflow: hidden;
    transition: height 0.25s ease;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #06c755;
  }
  .pull-indicator.pulling {
    transition: none;
  }
  .pull-indicator .pull-icon {
    display: inline-block;
    font-size: 22px;
    transition: transform 0.2s ease;
  }
  .pull-indicator.ready .pull-icon {
    transform: rotate(180deg);
  }
  .pull-indicator.refreshing .pull-icon {
    animation: pull-spin 0.8s linear infinite;
  }
  @keyframes pull-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ヘッダー */
  .header {
    background: linear-gradient(135deg, #06c755 0%, #04a847 100%);
    padding: calc(20px + env(safe-area-inset-top)) 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(6, 199, 85, 0.3);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    margin-top: 4px;
  }
  .badge {
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    margin-left: auto;
  }
  .refresh-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.4s ease;
  }
  .refresh-btn:active { background: rgba(255,255,255,0.35); }
  .refresh-btn.spin { transform: rotate(360deg); }

  /* 絞り込みタブ */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 12px 0;
  }
  .tab {
    flex: 1;
    padding: 9px 4px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 10px;
    color: #333;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: #e8f5e9;
    border-color: #06c755;
    color: #06c755;
  }
  .tab .num {
    font-size: 11px;
    opacity: 0.7;
    margin-left: 3px;
  }

  /* メッセージカード */
  .card-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #ddd;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: opacity 0.25s ease, border-color 0.25s ease;
  }
  .card.sent {
    background: #f5f5f5;
    border-color: #e0e0e0;
  }
  .card.sent .message-text { color: #444; }
  .card-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #eee;
  }
  .card-header .dest {
    font-size: 16px;
    font-weight: 600;
    color: #000;
  }
  .card-header .tone-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    margin-left: auto;
    white-space: nowrap;
  }
  .tone-group { background: #f3e8ff; color: #6d28d9; border: 1px solid #c4b5fd; }
  .tone-friend { background: #fff7ed; color: #c2410c; border: 1px solid #fb923c; }
  .tone-work { background: #e8f5e9; color: #15803d; border: 1px solid #6ee7a0; }
  .tone-normal { background: #f3f4f6; color: #4b5563; border: 1px solid #9ca3af; }
  .tone-polite { background: #eff6ff; color: #1d4ed8; border: 1px solid #60a5fa; }

  .priority-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .priority-high { background: #ef4444; box-shadow: 0 0 8px #ef444466; }
  .priority-mid { background: #eab308; box-shadow: 0 0 8px #eab30866; }
  .priority-low { background: #22c55e; box-shadow: 0 0 8px #22c55e66; }

  /* メッセージ本文 */
  .card-body {
    padding: 14px 16px;
  }
  .message-text {
    font-size: 15px;
    line-height: 1.7;
    color: #111;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message-text.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .more-btn {
    margin-top: 8px;
    background: none;
    border: none;
    color: #06c755;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    padding: 2px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 時間表示 */
  .card-meta {
    padding: 0 16px 6px;
    font-size: 11px;
    color: #555;
  }
  .card-meta .sent-at {
    color: #4f46e5;
  }

  /* ボタンエリア */
  .card-actions {
    padding: 10px 16px 14px;
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .btn:active {
    transform: scale(0.96);
  }
  .btn-copy {
    background: #06c755;
    color: #fff;
  }
  .btn-copy.copied {
    background: #1d4ed8;
  }
  .btn-line {
    background: #e8f5e9;
    color: #06c755;
    flex: 0 0 48px;
    font-size: 18px;
  }
  .btn-done {
    background: #f0f0f0;
    color: #333;
    flex: 0.7;
  }
  .btn-done.checked {
    background: #e8eaf6;
    color: #4338ca;
    flex: 0.9;
  }
  .btn-delete {
    background: #fef2f2;
    color: #dc2626;
    flex: 0 0 48px;
    font-size: 16px;
  }
  .btn-delete:active {
    background: #fee2e2;
  }

  /* 全件消去ボタン */
  .btn-clear-all {
    display: block;
    width: 100%;
    margin: 16px auto 0;
    padding: 14px;
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .btn-clear-all:active {
    background: #b91c1c;
    transform: scale(0.97);
  }

  /* 空状態 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #555;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .empty-state h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 8px;
  }
  .empty-state p { font-size: 13px; }

  /* トースト通知 */
  .toast {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: #06c755;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(6,199,85,0.4);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* 更新日時 */
  .update-info {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: #555;
    line-height: 1.8;
  }
  .reset-btn {
    background: none;
    border: none;
    color: #555;
    font-size: 11px;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  /* 編集モード */
  .edit-area {
    width: 100%;
    min-height: 120px;
    background: #f9f9f9;
    color: #111;
    border: 1px solid #06c755;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    line-height: 1.7;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .edit-area:focus {
    border-color: #4ade80;
    box-shadow: 0 0 0 2px rgba(6,199,85,0.2);
  }
  .edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-save {
    background: #06c755;
    color: #fff;
  }
  .btn-cancel {
    background: #f0f0f0;
    color: #333;
  }
  .btn-edit {
    background: #f0f0f0;
    color: #333;
    flex: 0 0 48px;
    font-size: 16px;
  }
  .edited-badge {
    display: inline-block;
    font-size: 10px;
    color: #b45309;
    margin-left: 6px;
  }
  .btn-revert {
    background: none;
    border: none;
    color: #b45309;
    font-size: 10px;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 4px;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span>LINE送信管理</span>
    <span class="badge" id="count">0件</span>
    <button class="refresh-btn" id="refreshBtn" title="最新を読み込む">🔄</button>
    <button class="refresh-btn" id="clearBtn" style="display:none" title="送信済みを一覧から消す">🗑</button>
  </h1>
  <div class="subtitle" id="subtitle">コピーしてLINEに貼り付け</div>
</div>

<div class="pull-indicator" id="pullIndicator">
  <span class="pull-icon">↓</span>
  <span class="pull-text">&nbsp;引っぱって更新</span>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-filter="todo">未送信<span class="num" id="numTodo"></span></button>
  <button class="tab" data-filter="sent">送信済み<span class="num" id="numSent"></span></button>
  <button class="tab" data-filter="all">すべて<span class="num" id="numAll"></span></button>
</div>

<div class="card-list" id="cardList"></div>
<div class="update-info" id="updateInfo"></div>
<div class="toast" id="toast"></div>

<script>
// ===== メッセージデータ =====
// 中身は messages.json に入っている（add.mjs が更新する）
// 開くたびに毎回サーバーから取り直すので、古い内容が残らない
let messages = [];
let lastUpdated = '';

// ===== 記録（スマホ内に保存） =====
// sent  … 送信済みにしたもの
// hidden … 一覧から消したもの（元データは残るので元に戻せる）
const SENT_KEY = 'lineSender.sent.v1';
const HIDDEN_KEY = 'lineSender.hidden.v1';
const EDIT_KEY = 'lineSender.edit.v1';

function loadMap(key) {
  try {
    const raw = localStorage.getItem(key);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  } catch {
    return {};
  }
}

function saveMap(key, map) {
  try {
    localStorage.setItem(key, JSON.stringify(map));
  } catch {
    showToast('保存できませんでした（プライベートモード？）');
  }
}

// 今あるメッセージのぶんだけ残す（古い記録の掃除）
function pruneMap(map) {
  const ids = new Set(messages.map(m => m.id));
  const cleaned = {};
  for (const id of Object.keys(map)) {
    if (ids.has(id)) cleaned[id] = map[id];
  }
  return cleaned;
}

let sentMap = loadMap(SENT_KEY);
let hiddenMap = loadMap(HIDDEN_KEY);
let editMap = loadMap(EDIT_KEY);
let currentFilter = 'todo';
let editingId = null; // 今編集中のメッセージID

// 編集済みテキストがあればそれを、なければ元のテキストを返す
function getMessageText(id) {
  if (Object.prototype.hasOwnProperty.call(editMap, id)) return editMap[id];
  const m = messages.find(x => x.id === id);
  return m ? m.message : '';
}

function isEdited(id) {
  return Object.prototype.hasOwnProperty.call(editMap, id);
}

// ===== 表示 =====
const PRIORITY_ORDER = { high: 0, mid: 1, low: 2 };

function sortedMessages() {
  return messages.filter(m => !isHidden(m.id)).sort((a, b) => {
    const pa = PRIORITY_ORDER[a.priority] ?? 3;
    const pb = PRIORITY_ORDER[b.priority] ?? 3;
    if (pa !== pb) return pa - pb;
    return String(b.created).localeCompare(String(a.created));
  });
}

function isSent(id) {
  return Object.prototype.hasOwnProperty.call(sentMap, id);
}

function isHidden(id) {
  return Object.prototype.hasOwnProperty.call(hiddenMap, id);
}

function hiddenCount() {
  return messages.filter(m => isHidden(m.id)).length;
}

function render() {
  const list = document.getElementById('cardList');
  const all = sortedMessages();
  const todo = all.filter(m => !isSent(m.id));
  const sent = all.filter(m => isSent(m.id));

  document.getElementById('count').textContent = todo.length + '件';
  document.getElementById('numTodo').textContent = todo.length;
  document.getElementById('numSent').textContent = sent.length;
  document.getElementById('numAll').textContent = all.length;

  const shown = currentFilter === 'todo' ? todo
              : currentFilter === 'sent' ? sent
              : all;

  if (shown.length === 0) {
    list.innerHTML = emptyState();
  } else {
    list.innerHTML = shown.map(createCard).join('');
  }

  document.getElementById('subtitle').textContent =
    lastUpdated ? '最終更新: ' + lastUpdated : 'コピーしてLINEに貼り付け';

  // 🗑ボタンは、送信済みが1件以上あるときだけ出す
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.style.display = sent.length > 0 ? '' : 'none';
  clearBtn.title = `送信済み${sent.length}件を一覧から消す`;

  let footer = '最終更新: ' + escHtml(lastUpdated)
    + '<br><button class="reset-btn" id="resetBtn">送信済みマークをすべて解除する</button>';
  if (shown.length > 0 && (currentFilter === 'sent' || currentFilter === 'all')) {
    footer += '<br><button class="btn-clear-all" id="clearAllBtn">🗑 全件消去</button>';
  }
  document.getElementById('updateInfo').innerHTML = footer;
}

function emptyState() {
  if (currentFilter === 'sent') {
    return `
      <div class="empty-state">
        <div class="icon">📭</div>
        <h2>送信済みはまだありません</h2>
        <p>送ったら「送信済み」を押してください</p>
      </div>`;
  }
  if (currentFilter === 'all') {
    return `
      <div class="empty-state">
        <div class="icon">📝</div>
        <h2>メッセージがありません</h2>
        <p>新しい依頼があると、ここに追加されます</p>
      </div>`;
  }
  return `
    <div class="empty-state">
      <div class="icon">✅</div>
      <h2>未送信メッセージなし</h2>
      <p>すべて送信済みです！</p>
    </div>`;
}

function createCard(m) {
  const priorityClass = m.priority === 'high' ? 'priority-high' :
                        m.priority === 'mid' ? 'priority-mid' : 'priority-low';
  const done = isSent(m.id);
  const text = getMessageText(m.id);
  const edited = isEdited(m.id);
  const editing = editingId === m.id;
  const long = !editing && ((text.match(/\n/g) || []).length >= 6 || text.length > 220);

  let bodyHtml;
  if (editing) {
    bodyHtml = `
      <textarea class="edit-area" id="editArea-${m.id}">${escHtml(text)}</textarea>
      <div class="edit-actions">
        <button class="btn btn-save" data-action="editSave" data-id="${m.id}">💾 保存</button>
        <button class="btn btn-cancel" data-action="editCancel" data-id="${m.id}">キャンセル</button>
      </div>`;
  } else {
    bodyHtml = `
      <div class="message-text ${long ? 'clamped' : ''}" id="text-${m.id}">${escHtml(text)}</div>
      ${long ? `<button class="more-btn" data-action="more" data-id="${m.id}">▼ 全文を表示</button>` : ''}`;
  }

  const editedLabel = edited && !editing
    ? `<span class="edited-badge">✏️ 編集済み <button class="btn-revert" data-action="revert" data-id="${m.id}">元に戻す</button></span>`
    : '';

  return `
    <div class="card ${done ? 'sent' : ''}" id="card-${m.id}">
      <div class="card-header">
        <div class="priority-dot ${priorityClass}"></div>
        <span class="dest">${escHtml(m.dest)}${editedLabel}</span>
        <span class="tone-badge ${m.toneClass}">${escHtml(m.tone)}</span>
      </div>
      <div class="card-body">
        ${bodyHtml}
      </div>
      <div class="card-meta">
        ${escHtml(m.priorityLabel)} ・ ${escHtml(m.type)} ・ ${escHtml(m.created)}
        ${done ? `<br><span class="sent-at">✔ 送信済み: ${escHtml(sentMap[m.id])}</span>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn btn-copy" id="copy-${m.id}" data-action="copy" data-id="${m.id}">📋 コピー</button>
        <button class="btn btn-edit" data-action="edit" data-id="${m.id}" title="本文を編集">✏️</button>
        <button class="btn btn-line" data-action="line" title="LINEを開く">💬</button>
        <button class="btn btn-done ${done ? 'checked' : ''}" data-action="done" data-id="${m.id}">
          ${done ? '↩ 取り消し' : '✅ 送信済み'}
        </button>
        <button class="btn btn-delete" data-action="delete" data-id="${m.id}" title="消去">🗑</button>
      </div>
    </div>`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

// ===== 操作 =====
async function copyMsg(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;

  const text = getMessageText(id);
  let ok = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    document.body.removeChild(ta);
  }

  if (!ok) {
    showToast('コピーできませんでした');
    return;
  }

  const btn = document.getElementById('copy-' + id);
  if (btn) {
    btn.classList.add('copied');
    btn.innerHTML = '✅ コピー済み';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 コピー';
    }, 3000);
  }
  showToast('コピーしました！LINEに貼り付けてください');
}

function toggleDone(id) {
  if (isSent(id)) {
    delete sentMap[id];
    saveMap(SENT_KEY, sentMap);
    render();
    showToast('未送信に戻しました');
  } else {
    sentMap[id] = nowLabel();
    saveMap(SENT_KEY, sentMap);
    render();
    showToast('送信済みにしました');
  }
}

// 個別メッセージを消去（一覧から消す）
function deleteMsg(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  const dest = m.dest.length > 15 ? m.dest.slice(0, 15) + '…' : m.dest;
  if (!confirm(`「${dest}」のメッセージを消去しますか？`)) return;
  hiddenMap[id] = nowLabel();
  saveMap(HIDDEN_KEY, hiddenMap);
  render();
  showToast('消去しました');
}

// 全件消去（表示中のメッセージをすべて一覧から消す）
function clearAllMessages() {
  const targets = sortedMessages();
  if (targets.length === 0) {
    showToast('消去するメッセージがありません');
    return;
  }
  if (!confirm(`表示中の${targets.length}件を全件消去します。よろしいですか？`)) return;
  const now = nowLabel();
  for (const m of targets) hiddenMap[m.id] = now;
  saveMap(HIDDEN_KEY, hiddenMap);
  render();
  showToast(`${targets.length}件を消去しました`);
}

// 送信済みをまとめて一覧から消す（元データは残る）
function clearSent() {
  const targets = messages.filter(m => !isHidden(m.id) && isSent(m.id));
  if (targets.length === 0) {
    showToast('送信済みはありません');
    return;
  }
  if (!confirm(`送信済みの${targets.length}件を一覧から消します。\n（元に戻すこともできます）`)) return;

  const now = nowLabel();
  for (const m of targets) hiddenMap[m.id] = now;
  saveMap(HIDDEN_KEY, hiddenMap);
  render();
  showToast(`${targets.length}件を消しました`);
}

// 消したものを元に戻す
function restoreHidden() {
  const n = hiddenCount();
  if (n === 0) return;
  hiddenMap = {};
  saveMap(HIDDEN_KEY, hiddenMap);
  render();
  showToast(`${n}件を元に戻しました`);
}

function nowLabel() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ===== 編集操作 =====
function startEdit(id) {
  editingId = id;
  render();
  // テキストエリアにフォーカスし、末尾にカーソルを置く
  const area = document.getElementById('editArea-' + id);
  if (area) {
    area.focus();
    area.selectionStart = area.selectionEnd = area.value.length;
    // 高さを内容に合わせる
    area.style.height = area.scrollHeight + 'px';
    area.addEventListener('input', () => {
      area.style.height = 'auto';
      area.style.height = area.scrollHeight + 'px';
    });
  }
}

function saveEdit(id) {
  const area = document.getElementById('editArea-' + id);
  if (!area) return;
  const newText = area.value;
  const m = messages.find(x => x.id === id);
  if (!m) return;

  // 元のテキストと同じなら編集記録を消す
  if (newText === m.message) {
    delete editMap[id];
  } else {
    editMap[id] = newText;
  }
  saveMap(EDIT_KEY, editMap);
  editingId = null;
  render();
  showToast('本文を保存しました');
}

function cancelEdit(id) {
  editingId = null;
  render();
}

function revertEdit(id) {
  delete editMap[id];
  saveMap(EDIT_KEY, editMap);
  render();
  showToast('元の文面に戻しました');
}

function expand(id) {
  const el = document.getElementById('text-' + id);
  if (!el) return;
  el.classList.remove('clamped');
  const btn = document.querySelector(`[data-action="more"][data-id="${id}"]`);
  if (btn) btn.remove();
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== イベント =====
document.getElementById('cardList').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  switch (btn.dataset.action) {
    case 'copy': copyMsg(id); break;
    case 'done': toggleDone(id); break;
    case 'more': expand(id); break;
    case 'line': location.href = 'https://line.me/R/nv/chat'; break;
    case 'edit': startEdit(id); break;
    case 'editSave': saveEdit(id); break;
    case 'editCancel': cancelEdit(id); break;
    case 'revert': revertEdit(id); break;
    case 'delete': deleteMsg(id); break;
  }
});

// タブ切替の共通関数
const TAB_ORDER = ['todo', 'sent', 'all'];

function switchTab(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.filter === filter)
  );
  render();
  window.scrollTo({ top: 0 });
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchTab(tab.dataset.filter);
});

// ===== 左右スワイプでタブ切替 =====
{
  let swStartX = 0;
  let swStartY = 0;
  let swActive = false;

  document.getElementById('cardList').addEventListener('touchstart', e => {
    swStartX = e.touches[0].clientX;
    swStartY = e.touches[0].clientY;
    swActive = true;
  }, { passive: true });

  document.getElementById('cardList').addEventListener('touchmove', e => {
    if (!swActive) return;
    // 縦移動が大きくなったらスワイプ候補から外す（通常スクロール）
    const dy = Math.abs(e.touches[0].clientY - swStartY);
    if (dy > 30) swActive = false;
  }, { passive: true });

  document.getElementById('cardList').addEventListener('touchend', e => {
    if (!swActive) return;
    swActive = false;
    const dx = e.changedTouches[0].clientX - swStartX;
    const dy = e.changedTouches[0].clientY - swStartY;

    // 水平50px以上 かつ 水平が垂直の2倍以上 → スワイプ
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 2) return;

    const idx = TAB_ORDER.indexOf(currentFilter);
    if (dx < 0 && idx < TAB_ORDER.length - 1) {
      switchTab(TAB_ORDER[idx + 1]); // ← 左スワイプ → 次のタブ
    } else if (dx > 0 && idx > 0) {
      switchTab(TAB_ORDER[idx - 1]); // → 右スワイプ → 前のタブ
    }
  }, { passive: true });
}

document.getElementById('updateInfo').addEventListener('click', e => {
  if (e.target.closest('#clearAllBtn')) {
    clearAllMessages();
    return;
  }
  if (!e.target.closest('#resetBtn')) return;
  if (!confirm('送信済みマークをすべて解除して、全部を未送信に戻します。よろしいですか？')) return;
  sentMap = {};
  saveMap(SENT_KEY, sentMap);
  render();
  showToast('送信済みマークを解除しました');
});

document.getElementById('clearBtn').addEventListener('click', clearSent);

// ===== データ読み込み =====
function showLoading() {
  document.getElementById('cardList').innerHTML = `
    <div class="empty-state">
      <div class="icon">⏳</div>
      <h2>読み込み中…</h2>
    </div>`;
}

function showLoadError(detail) {
  document.getElementById('cardList').innerHTML = `
    <div class="empty-state">
      <div class="icon">⚠️</div>
      <h2>読み込めませんでした</h2>
      <p>電波を確認して、画面を下に引っぱって更新してください</p>
    </div>`;
  document.getElementById('updateInfo').textContent = 'エラー: ' + detail;
}

async function loadData(quiet) {
  if (!quiet) showLoading();
  try {
    // GitHub raw から直接取得（Pages のビルド待ちをスキップして即反映）
    // ?t=... と no-store で、ブラウザキャッシュも回避
    const RAW_URL = 'https://raw.githubusercontent.com/kikukenkogyo/line-sender/main/messages.json';
    const res = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const list = Array.isArray(data) ? data : (data && data.messages) || [];
    const stamp = (data && data.updated) || '';
    const changed = list.length !== messages.length;

    messages = list;
    lastUpdated = stamp;
    sentMap = pruneMap(sentMap);
    saveMap(SENT_KEY, sentMap);
    hiddenMap = pruneMap(hiddenMap);
    saveMap(HIDDEN_KEY, hiddenMap);
    editMap = pruneMap(editMap);
    saveMap(EDIT_KEY, editMap);
    render();

    if (quiet && changed) showToast('新しいメッセージがあります');
  } catch (e) {
    if (!quiet) showLoadError(e.message);
  }
}

// ===== プルダウン更新 =====
{
  const pullEl = document.getElementById('pullIndicator');
  const pullIcon = pullEl.querySelector('.pull-icon');
  const pullText = pullEl.querySelector('.pull-text');
  const THRESHOLD = 70;   // この距離以上引いたら更新
  const MAX_PULL = 120;
  let startY = 0;
  let pulling = false;
  let refreshing = false;

  document.addEventListener('touchstart', e => {
    if (refreshing) return;
    // ページ最上部付近のときだけ有効
    if (window.scrollY > 5) return;
    startY = e.touches[0].clientY;
    pulling = true;
    pullEl.classList.add('pulling');
    pullEl.classList.remove('ready', 'refreshing');
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy < 0) { // 上スクロール
      pullEl.style.height = '0px';
      return;
    }
    // 引っ張り距離に応じてインジケーターを伸ばす（減衰つき）
    const dist = Math.min(dy * 0.5, MAX_PULL);
    pullEl.style.height = dist + 'px';

    if (dist >= THRESHOLD) {
      pullEl.classList.add('ready');
      pullText.innerHTML = '&nbsp;離して更新';
    } else {
      pullEl.classList.remove('ready');
      pullText.innerHTML = '&nbsp;引っぱって更新';
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!pulling || refreshing) return;
    pulling = false;
    pullEl.classList.remove('pulling');

    const h = parseFloat(pullEl.style.height) || 0;
    if (h >= THRESHOLD) {
      // 更新実行
      refreshing = true;
      pullEl.classList.remove('ready');
      pullEl.classList.add('refreshing');
      pullEl.style.height = '50px';
      pullIcon.textContent = '🔄';
      pullText.innerHTML = '&nbsp;更新中…';

      const before = messages.length;
      await loadData(true);
      showToast(messages.length > before ? '新しいメッセージがあります' : '最新の状態です');

      pullEl.classList.remove('refreshing');
      pullEl.style.height = '0px';
      pullIcon.textContent = '↓';
      pullText.innerHTML = '&nbsp;引っぱって更新';
      refreshing = false;
    } else {
      // 閾値未満 → 戻す
      pullEl.style.height = '0px';
    }
  });
}

// アプリに戻ってきたら、黙って最新を取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadData(true);
});

// 🔄ボタン：手動で最新を読み込む
document.getElementById('refreshBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  btn.classList.add('spin');
  const before = messages.length;
  await loadData(true);
  setTimeout(() => btn.classList.remove('spin'), 400);
  showToast(messages.length > before ? '新しいメッセージがあります' : '最新の状態です');
});

loadData(false);
</script>
